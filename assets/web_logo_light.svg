<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb76c"/>
      <stop offset="50%" stop-color="#cfa750"/>
      <stop offset="100%" stop-color="#9a7428"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b365d"/>
      <stop offset="100%" stop-color="#0c1d38"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- LOGO EMBLEM (Lotus + NM Monogram) -->
  <g transform="translate(10, 8)" filter="url(#subtleShadow)">
    <!-- Outer Decorative Floral Ring -->
    <circle cx="42" cy="42" r="40" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="42" cy="42" r="36" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="3,2"/>
    
    <!-- Lotus Petals Backdrop -->
    <path d="M42 12 C32 26 26 38 42 54 C58 38 52 26 42 12 Z" fill="url(#goldGrad)" opacity="0.25"/>
    <path d="M42 18 C35 30 20 34 22 47 C28 47 38 42 42 54 C46 42 56 47 62 47 C64 34 49 30 42 18 Z" fill="url(#goldGrad)" opacity="0.2"/>
    
    <!-- Stylized Floral Monogram N & M -->
    <g fill="none" stroke="url(#blueGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Letter N -->
      <path d="M28 58 L28 32 L40 54 L40 32" />
      <!-- Letter M connected elegantly -->
      <path d="M44 58 L44 32 L50 44 L56 32 L56 58" stroke="url(#goldGrad)" stroke-width="3.2"/>
    </g>
    
    <!-- Crown / Lotus Blossom Tip -->
    <path d="M42 18 C40 22 44 22 42 18" stroke="url(#goldGrad)" stroke-width="2" fill="url(#goldGrad)"/>
    <circle cx="42" cy="62" r="2" fill="url(#goldGrad)"/>
    <circle cx="36" cy="62" r="1.2" fill="url(#goldGrad)"/>
    <circle cx="48" cy="62" r="1.2" fill="url(#goldGrad)"/>
  </g>

  <!-- BRAND NAME & TYPOGRAPHY -->
  <g transform="translate(108, 0)">
    <!-- Small Tagline Above -->
    <text x="0" y="27" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="3" fill="#cfa750" text-transform="uppercase">
      FLORIST &amp; ART BOUTIQUE
    </text>

    <!-- Main Title -->
    <text x="0" y="55" font-family="'Playfair Display', 'Cinzel', 'Times New Roman', serif" font-size="27" font-weight="800" letter-spacing="1" fill="#112b54">
      NGUYỄN MIỀN
    </text>

    <!-- Subtitle / Business type -->
    <text x="0" y="74" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="500" letter-spacing="1.2" fill="#5a6a85">
      Điện Hoa Tươi Nghệ Thuật &amp; Sự Kiện Cao Cấp
    </text>

    <!-- Hotline Badge -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="138" height="15" rx="7.5" fill="#f5f0e6"/>
      <circle cx="8" cy="7.5" r="3" fill="#25d366"/>
      <text x="17" y="11.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#112b54" letter-spacing="0.5">
        HOTLINE: 0393.945.347
      </text>
    </g>
  </g>
</svg>
