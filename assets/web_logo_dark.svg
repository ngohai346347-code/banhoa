<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d68f"/>
      <stop offset="50%" stop-color="#dfb76c"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <!-- LOGO EMBLEM (Lotus + NM Monogram) -->
  <g transform="translate(10, 8)">
    <!-- Outer Decorative Floral Ring -->
    <circle cx="42" cy="42" r="40" fill="#0c1d38" stroke="url(#goldGradDark)" stroke-width="2"/>
    <circle cx="42" cy="42" r="36" fill="none" stroke="url(#goldGradDark)" stroke-width="0.8" stroke-dasharray="3,2"/>
    
    <!-- Lotus Petals Backdrop -->
    <path d="M42 12 C32 26 26 38 42 54 C58 38 52 26 42 12 Z" fill="url(#goldGradDark)" opacity="0.3"/>
    
    <!-- Stylized Floral Monogram N & M -->
    <g fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 58 L28 32 L40 54 L40 32" />
      <path d="M44 58 L44 32 L50 44 L56 32 L56 58" stroke="url(#goldGradDark)" stroke-width="3.2"/>
    </g>
    
    <path d="M42 18 C40 22 44 22 42 18" stroke="url(#goldGradDark)" stroke-width="2" fill="url(#goldGradDark)"/>
    <circle cx="42" cy="62" r="2" fill="url(#goldGradDark)"/>
  </g>

  <!-- BRAND NAME & TYPOGRAPHY -->
  <g transform="translate(108, 0)">
    <text x="0" y="27" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="3" fill="#dfb76c" text-transform="uppercase">
      FLORIST &amp; ART BOUTIQUE
    </text>

    <text x="0" y="55" font-family="'Playfair Display', 'Cinzel', 'Times New Roman', serif" font-size="27" font-weight="800" letter-spacing="1" fill="#ffffff">
      NGUYỄN MIỀN
    </text>

    <text x="0" y="74" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" letter-spacing="1" fill="#b0c0d8">
      Điện Hoa Tươi Nghệ Thuật &amp; Sự Kiện Toàn Quốc
    </text>

    <!-- Hotline Badge Dark -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="138" height="15" rx="7.5" fill="#1b365d" stroke="#335c96" stroke-width="1"/>
      <circle cx="8" cy="7.5" r="3" fill="#25d366"/>
      <text x="17" y="11.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#f5d68f" letter-spacing="0.5">
        HOTLINE: 0393.945.347
      </text>
    </g>
  </g>
</svg>
